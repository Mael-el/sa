  <text x="68" y="918" font-size="10.5" fill="#334155"><tspan font-weight="700" fill="#0f2a43">Règles :</tspan> rayons 8 / 10 / 12 px · bordures 1 px #E3E9F1 · ombres douces réservées aux éléments flottants · focus visible 2 px bleu · contrastes texte ≥ 4,5:1</text>
  <text x="68" y="936" font-size="10.5" fill="#64748b">Jamais de dégradé décoratif sur les surfaces de contenu : le bleu institutionnel reste réservé à la navigation active, aux actions et aux en-têtes.</text>
